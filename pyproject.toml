[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-mail-hub"
version = "1.0.0"
description = "FastAPI app for email ingestion & dynamic Notion task candidate sync"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings",
    "httpx>=0.27.0",
    "notion-client>=2.2.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "pywebpush>=1.14.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
