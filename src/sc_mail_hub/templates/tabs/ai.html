<!-- AI Engine Configuration View: Provider selection (Mock, OpenAI, Gemini, Groq), API key configuration, and connectivity testing -->
<section id="tab-ai" class="tab-content">
  <div class="card">
    <div class="card-title">AI Task Extraction Engine</div>
    <p style="font-size:14px; color:var(--text-muted); margin-bottom:16px;">
      Choose your preferred AI Provider. If set to <strong>Built-in Heuristic Engine (Mock)</strong>, the app uses
      smart NLP keyword & deadline parsing without requiring an API key.
    </p>

    <div class="form-grid-2" style="margin-bottom:16px;">
      <div>
        <label style="font-size:13px; font-weight:600; color:var(--text-muted);">AI Provider</label>
        <select id="ai-provider" class="select-input">
          <option value="mock">Built-in Smart Heuristic Engine (No API Key Required)</option>
          <option value="openai">OpenAI (GPT-4o-mini / GPT-4o)</option>
          <option value="gemini">Google Gemini API</option>
          <option value="groq">Groq Cloud (Llama 3.3 / Mixtral)</option>
        </select>
      </div>
      <div>
        <label style="font-size:13px; font-weight:600; color:var(--text-muted);">Model Name</label>
        <input type="text" id="ai-model" class="text-input"
          placeholder="e.g. llama-3.3-70b-versatile, gemini-3.1-flash-lite, gpt-4o-mini">
      </div>
    </div>


    <div style="margin-bottom:16px;">
      <label style="font-size:13px; font-weight:600; color:var(--text-muted);">API Key</label>
      <input type="password" id="ai-key" class="text-input" placeholder="sk-... or AIzaSy...">
    </div>

    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="saveAISettings()">💾 Save AI Settings</button>
      <button class="btn btn-outline" onclick="testAIConnection()">⚡ Test AI Connection</button>
    </div>
  </div>
</section>
