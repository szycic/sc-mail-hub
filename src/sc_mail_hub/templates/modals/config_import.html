<!-- Selective Configuration Import Modal -->
<div id="config-import-modal" class="modal-overlay" onclick="closeConfigImportModal(event)" style="display:none;">
  <div class="modal-card" onclick="event.stopPropagation()" style="max-width: 520px; width: 92vw;">
    <div class="modal-header">
      <div>
        <span class="type-pill"
          style="margin-bottom:6px; display:inline-block; background:rgba(59, 130, 246, 0.15); color:#60a5fa;">📦
          Selective Configuration Import</span>
        <h3 style="font-size:18px; color:var(--text-main); margin-bottom:4px;">Import Configuration Backup</h3>
        <div style="font-size:12px; color:var(--text-muted);" id="import-modal-filename">
          Select items to restore from backup file.
        </div>
      </div>
      <button class="modal-close-btn" onclick="closeConfigImportModal()">&times;</button>
    </div>

    <div class="modal-body" style="display:flex; flex-direction:column; gap:16px; padding-top:12px;">
      <p style="font-size:13px; color:var(--text-dim); margin:0;">
        Choose which configuration sections from the backup file you would like to restore:
      </p>

      <div style="display:flex; flex-direction:column; gap:12px; background:rgba(255,255,255,0.02); padding:16px; border-radius:8px; border:1px solid rgba(255,255,255,0.06);">
        <!-- Item 1: System Settings -->
        <label id="import-label-system-settings" style="display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer;">
          <div style="display:flex; align-items:center; gap:10px;">
            <input type="checkbox" id="import-chk-system-settings" style="width:18px; height:18px; cursor:pointer; accent-color:var(--accent-gradient);">
            <div>
              <span style="font-size:14px; font-weight:600; color:var(--text-main); display:block;">⚙️ Application System Settings</span>
              <span style="font-size:12px; color:var(--text-dim);">Polling intervals, UI auto-refresh & purge rules</span>
            </div>
          </div>
          <span id="import-badge-system-settings" class="type-pill" style="font-size:11px;">Found</span>
        </label>

        <hr style="border:0; border-top:1px solid rgba(255,255,255,0.06); margin:0;">

        <!-- Item 2: Notion Field Mappings -->
        <label id="import-label-field-mappings" style="display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer;">
          <div style="display:flex; align-items:center; gap:10px;">
            <input type="checkbox" id="import-chk-field-mappings" style="width:18px; height:18px; cursor:pointer; accent-color:var(--accent-gradient);">
            <div>
              <span style="font-size:14px; font-weight:600; color:var(--text-main); display:block;">🗺️ Notion Field Mappings</span>
              <span style="font-size:12px; color:var(--text-dim);" id="import-desc-field-mappings">Database property mappings</span>
            </div>
          </div>
          <span id="import-badge-field-mappings" class="type-pill" style="font-size:11px;">Found</span>
        </label>

        <hr style="border:0; border-top:1px solid rgba(255,255,255,0.06); margin:0;">

        <!-- Item 3: Auto-Ignore Rules -->
        <label id="import-label-auto-ignore-rules" style="display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer;">
          <div style="display:flex; align-items:center; gap:10px;">
            <input type="checkbox" id="import-chk-auto-ignore-rules" style="width:18px; height:18px; cursor:pointer; accent-color:var(--accent-gradient);">
            <div>
              <span style="font-size:14px; font-weight:600; color:var(--text-main); display:block;">🛡️ Auto-Ignore Ingestion Rules</span>
              <span style="font-size:12px; color:var(--text-dim);" id="import-desc-auto-ignore-rules">Email filtering rules</span>
            </div>
          </div>
          <span id="import-badge-auto-ignore-rules" class="type-pill" style="font-size:11px;">Found</span>
        </label>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeConfigImportModal()">Cancel</button>
      <button id="btn-confirm-config-import" class="btn btn-primary btn-sm" onclick="confirmConfigImport()" style="font-weight:600;">
        📤 Import Selected Sections
      </button>
    </div>
  </div>
</div>
