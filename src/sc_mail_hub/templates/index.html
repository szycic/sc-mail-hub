<!-- SC Mail Hub Single-Page Application Master Layout -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mail Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/static/assets/favicon.ico">
  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Mail Hub</h1>
          <p class="brand-subtitle">AI Email Ingestion & Dynamic Notion Task Sync</p>
        </div>
      </div>
    </header>

    <nav class="nav-tabs">
      <button class="nav-tab active" data-tab="inbox">
        <span>🤖</span> AI Inbox
      </button>
      <button class="nav-tab" data-tab="notion">
        <span>🗺️</span> Notion Settings
      </button>
      <button class="nav-tab" data-tab="accounts">
        <span>📧</span> Connected Accounts
      </button>
      <button class="nav-tab" data-tab="ai">
        <span>⚙️</span> AI Settings
      </button>
      <button class="nav-tab" data-tab="admin">
        <span>🛠️</span> Admin Panel
      </button>
    </nav>

    {% include 'tabs/inbox.html' %}
    {% include 'tabs/notion.html' %}
    {% include 'tabs/accounts.html' %}
    {% include 'tabs/ai.html' %}
    {% include 'tabs/admin.html' %}
  </div>

  {% include 'modals/email_preview.html' %}
  {% include 'modals/task_review.html' %}

  <div id="toast-container"></div>

  <script src="/static/js/utils.js"></script>
  <script src="/static/js/navigation.js"></script>
  <script src="/static/js/inbox.js"></script>
  <script src="/static/js/task_review.js"></script>
  <script src="/static/js/email_preview.js"></script>
  <script src="/static/js/accounts.js"></script>
  <script src="/static/js/notion.js"></script>
  <script src="/static/js/ai_settings.js"></script>
  <script src="/static/js/app.js"></script>
</body>

</html>
